[package]
name = "agentbond-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Local LiteSVM + x402 mock facilitator demonstration (no internet)"

[[bin]]
name = "agentbond-sim"
path = "src/main.rs"

[dependencies]
agentbond-types = { workspace = true }
agentbond-sdk = { workspace = true }
agentbond-payments = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
# Match program tests for LiteSVM receipt signing (host workspace pins dalek 2).
ed25519-dalek = "=1.0.1"
litesvm = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-clock = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true }
spl-associated-token-account-client = { workspace = true }
spl-token = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
