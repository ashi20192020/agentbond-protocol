[package]
name = "agentbond"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "AgentBond Solana program"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []

[dependencies]
agentbond-types = { workspace = true }
pinocchio = { workspace = true }
pinocchio-system = { workspace = true }
pinocchio-token = { workspace = true }
sha2 = { workspace = true }
solana-address = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-address = { workspace = true, features = ["curve25519"] }

[dev-dependencies]
agentbond-types = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true }
litesvm = { workspace = true }
proptest = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
solana-clock = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true }
spl-associated-token-account-client = { workspace = true }
spl-token = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
