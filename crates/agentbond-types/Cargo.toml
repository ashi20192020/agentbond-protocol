[package]
name = "agentbond-types"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared AgentBond protocol types, receipt codec, and state rules"
publish = false

[features]
default = ["std"]
std = ["sha2/std"]

[dependencies]
sha2 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
